[workspace]
members = [
    "crates/opdev-cli",
    "crates/opdev-core",
    "crates/opdev-project",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://gitlab.com/stolenfootball-tools/opinionateddevelopment"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.6.6", features = ["derive"] }
jsonschema = { version = "0.52.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde-saphyr = "1.1.0"
thiserror = "2.0.20"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
