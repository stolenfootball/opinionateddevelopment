[workspace]
members = [
    "crates/opdev-cli",
    "crates/opdev-ci",
    "crates/opdev-core",
    "crates/opdev-engine",
    "crates/opdev-project",
    "crates/opdev-release",
    "crates/opdev-remote",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://gitlab.com/stolenfootball-tools/opinionateddevelopment"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.6.6", features = ["derive"] }
command-group = "5.0.1"
flate2 = "1.1.10"
jsonschema = { version = "0.52.0", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde-saphyr = "1.1.0"
semver = { version = "1.0.27", features = ["serde"] }
sha2 = "0.10.9"
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.20"
tempfile = "3.27.0"
url = "2.5.8"
zip = { version = "8.3.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
