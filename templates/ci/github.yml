name: OpDev

on:
  pull_request:
  push:
    branches: [{{TRUNK_JSON}}]

permissions:
  contents: read

jobs:
  opdev:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned OpDev
        env:
          OPDEV_VERSION: {{VERSION_JSON}}
        run: |
          set -euo pipefail
          base="https://gitlab.com/stolenfootball-tools/opinionateddevelopment/-/releases/v${OPDEV_VERSION}/downloads"
          archive="opdev-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" "$base/$archive"
          curl --fail --silent --show-error --location --output SHA256SUMS "$base/SHA256SUMS"
          grep "  $archive$" SHA256SUMS | sha256sum -c -
          tar -xzf "$archive"
          install -m 0755 opdev "$RUNNER_TEMP/opdev"
      - name: Evaluate integration gate
        run: "$RUNNER_TEMP/opdev check --ci --format json > opdev-report.json"
      - name: Preserve OpDev evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opdev-report
          path: opdev-report.json
          if-no-files-found: warn
