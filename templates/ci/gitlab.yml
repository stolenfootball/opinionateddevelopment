stages:
  - verify

variables:
  OPDEV_VERSION: {{VERSION_JSON}}

opdev:
  stage: verify
  image: {{IMAGE_JSON}}
  before_script:
    - set -eu
    - 'for command in git curl tar sha256sum mktemp; do command -v "$command" >/dev/null || { echo "OpDev CI requires $command in the selected image" >&2; exit 1; }; done'
    - base="https://gitlab.com/stolenfootball-tools/opinionateddevelopment/-/releases/v${OPDEV_VERSION}/downloads"
    - archive="opdev-${OPDEV_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
    - install_dir="$(mktemp -d)"
    - curl --fail --silent --show-error --location --output "$install_dir/$archive" "$base/$archive"
    - curl --fail --silent --show-error --location --output "$install_dir/SHA256SUMS" "$base/SHA256SUMS"
    - (cd "$install_dir" && grep "  $archive$" SHA256SUMS | sha256sum -c - && tar -xzf "$archive")
    - export PATH="$install_dir:$PATH"
    - opdev version
  script:
    - |
      set -e
      report_file="$(mktemp)"
      set +e
      opdev check --ci --format json > "$report_file"
      opdev_status=$?
      cp "$report_file" opdev-report.json
      copy_status=$?
      if [ "$copy_status" -ne 0 ]; then
        echo "Could not preserve the OpDev report" >&2
        exit "$copy_status"
      fi
      exit "$opdev_status"
  artifacts:
    when: always
    paths:
      - opdev-report.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
