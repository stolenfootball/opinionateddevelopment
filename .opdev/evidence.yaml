schema: 1
project:
  - rule_id: MCD-CONFIG-001
    outcome: passed
    summary: Behavior-controlling schemas, manifests, rules, templates, and toolchain versions are versioned and tested.
    evidence:
      - kind: repository
        summary: Strict project, report, profile, extension, evidence, and release schemas are checked into version control.
        location: schema
      - kind: test
        summary: Workspace tests parse schemas, manifests, profiles, CI templates, agent files, and protocol messages.
        location: crates
  - rule_id: MCD-PIPELINE-001
    outcome: passed
    summary: A protected tag pipeline gives the definitive release verdict only after native builds, repeat packaging, evidence generation, signing, and publication succeed.
    evidence:
      - kind: ci
        summary: RC2 completed every qualification and publication stage through the declared GitLab pipeline.
        location: https://gitlab.com/stolenfootball-tools/opinionateddevelopment/-/pipelines/2803675236
      - kind: policy
        summary: Release operations define the required candidate and final verdicts and prohibit manual publication.
        location: release/README.md
  - rule_id: MCD-ARTIFACT-001
    outcome: passed
    summary: The release contract defines deployable native CLI archives, a shared agent-plugin archive, checksums, signatures, an SBOM, provenance, and successful smoke checks.
    evidence:
      - kind: ci
        summary: The cross-platform builder qualifies all six native targets and the shared plugin payload before handoff.
        location: .github/workflows/release-build.yml
      - kind: release
        summary: RC2 published the complete declared artifact and evidence set.
        location: https://gitlab.com/stolenfootball-tools/opinionateddevelopment/-/releases/v0.1.0-rc.2
  - rule_id: MCD-ARTIFACT-002
    outcome: passed
    summary: Every archive is built once on its native runner, digest-bound to the exact source, and transferred unchanged to the sole publisher.
    evidence:
      - kind: ci
        summary: GitLab retrieves the exact GitHub run artifacts, repeats packaging to detect nondeterminism, verifies digests, and signs those same bytes without rebuilding them.
        location: .gitlab-ci.yml
      - kind: release
        summary: The release manifest and provenance bind RC2 artifact digests to source revision 103e1cd614fcbb171189bf48affd099170d0efab and its builder run.
        location: https://gitlab.com/stolenfootball-tools/opinionateddevelopment/-/releases/v0.1.0-rc.2
  - rule_id: MCD-ENV-001
    outcome: passed
    summary: Native artifacts and both agent-plugin formats are qualified in environments representative of every supported consumer target.
    evidence:
      - kind: ci
        summary: RC2 ran native build, deterministic-package, and smoke jobs on x86-64 and ARM64 Windows, Linux, and macOS runners.
        location: https://github.com/stolenfootball/opinionateddevelopment/actions/runs/33330835504
      - kind: validation
        summary: The shared plugin passes both the Codex and Claude Code plugin validators.
        location: plugins/opdev
  - rule_id: MCD-RECOVERY-001
    outcome: passed
    summary: OpDev's immutable, stateless releases use an exercised safe roll-forward procedure while consumers can remain pinned to the last known-good version.
    evidence:
      - kind: policy
        summary: The on-demand recovery procedure preserves evidence, restores trunk, requires regression protection, and republishes only through the canonical pipeline.
        location: release/README.md
      - kind: test
        summary: RC1 stopped before publication, RC2 exercised the corrected path, and the RC2 consumer-link defect was corrected through the same merge and release flow for RC3.
        location: https://gitlab.com/stolenfootball-tools/opinionateddevelopment/-/merge_requests/3
  - rule_id: MCD-CONFIG-002
    outcome: not_applicable
    summary: OpDev has no consumer environment-specific behavioral configuration; release credentials and tag inputs are injected only into CI and never rebuilt into artifacts.
    evidence:
      - kind: architecture
        summary: The distributed CLI and plugin are stateless and contain no destination-specific configuration layer.
        location: release/README.md
      - kind: ci
        summary: Publication credentials and exact release identity enter only at the protected GitLab pipeline boundary.
        location: .gitlab-ci.yml
  - rule_id: OPDEV-TEST-007
    outcome: passed
    summary: External release qualification declares its native runner environments, GitHub and GitLab dependencies, per-tag freshness, visible variability, and blocking effect on publication.
    evidence:
      - kind: ci
        summary: The build handoff is bound to an exact source revision and workflow run, retries are not hidden, and any unavailable or failing target blocks the protected tag pipeline.
        location: .github/workflows/release-build.yml
      - kind: policy
        summary: Release qualification requires a fresh candidate run and representative consumer installation before a final tag.
        location: release/README.md
  - rule_id: OPDEV-SUPPLY-001
    outcome: passed
    summary: Every released archive has machine-readable provenance and a keyless signature binding its digest to the exact source and GitLab release identity.
    evidence:
      - kind: release
        summary: RC2 includes an in-toto provenance statement, a release manifest, SHA-256 digests, and Sigstore bundles for all seven archives.
        location: https://gitlab.com/stolenfootball-tools/opinionateddevelopment/-/releases/v0.1.0-rc.2
      - kind: specification
        summary: Provenance scope and non-claims are explicitly defined.
        location: spec/release-evidence.md
  - rule_id: OPDEV-SUPPLY-002
    outcome: passed
    summary: Released Rust components are inventoried in a CycloneDX 1.5 SBOM whose digest is bound into the release manifest and provenance.
    evidence:
      - kind: release
        summary: RC2 publishes the generated CycloneDX document alongside the artifacts and its checksummed release evidence.
        location: https://gitlab.com/stolenfootball-tools/opinionateddevelopment/-/releases/v0.1.0-rc.2
      - kind: specification
        summary: The all-target dependency inventory scope and its limitations are documented without overstating artifact-level completeness.
        location: spec/release-evidence.md
  - rule_id: OPDEV-SEC-001
    outcome: passed
    summary: The project documents its attack surface and applies proportional controls at each untrusted boundary.
    evidence:
      - kind: policy
        summary: Reporting, repository trust, command execution, remote audit, extension, and release-evidence boundaries are documented.
        location: SECURITY.md
      - kind: test
        summary: Safe command execution, output bounds, process-tree timeouts, strict protocols, and remote host restrictions have automated tests.
        location: crates
  - rule_id: OPDEV-SEC-002
    outcome: passed
    summary: Untrusted change CI is separated from tag-only publication credentials and uses least-privilege permissions.
    evidence:
      - kind: ci
        summary: GitLab merge-request verification does not use publication tokens; package upload and OIDC signing are tag-only jobs.
        location: .gitlab-ci.yml
      - kind: ci
        summary: GitHub change CI declares read-only contents permission and uses full-SHA pinned actions.
        location: .github/workflows/opdev.yml
changes:
  - fingerprint: f9c2c180f5caee367bb6a8cdf4b9920d3cb94fb2969530f6a649f7970a18d38c
    work: https://gitlab.com/stolenfootball-tools/opinionateddevelopment/-/issues/10
    assertions:
      - rule_id: OPDEV-WORK-001
        outcome: passed
        summary: The tracked phase defines the outcome, representative validation, self-hosting, and release evidence acceptance.
        evidence:
          - kind: work
            summary: Phase 10 identifies cross-platform fixtures, self-enforcement, and release artifact evidence as acceptance conditions.
            location: https://gitlab.com/stolenfootball-tools/opinionateddevelopment/-/issues/10
      - rule_id: OPDEV-DESIGN-001
        outcome: passed
        summary: Durable process, extension, evidence, assurance, CI, and release decisions are recorded in the normative specification.
        evidence:
          - kind: decision
            summary: The evidence-ledger decision records the generalized problem, alternatives, rationale, tradeoff, and reversal trigger.
            location: spec/evidence-ledger.md
          - kind: decision
            summary: Extension and release boundaries are versioned alongside their schemas and implementations.
            location: spec/extensions.md
      - rule_id: MCD-TRUNK-002
        outcome: passed
        summary: The implementation branch originated from main, remained short-lived, and GitLab is configured to remove source branches after merge.
        evidence:
          - kind: git
            summary: The phase commits are a linear descendant of main and were produced during the same working day.
            location: codex/opdev-0.1
          - kind: remote
            summary: GitLab reports remove_source_branch_after_merge enabled and main protected against force pushes.
            location: https://gitlab.com/stolenfootball-tools/opinionateddevelopment/-/settings/merge_requests
      - rule_id: MCD-TRUNK-003
        outcome: passed
        summary: Active work integrated into the implementation branch repeatedly within one working day and is ready for its trunk pipeline.
        evidence:
          - kind: git
            summary: Each of the ten bounded phase commits and the final dogfood change was produced on 2026-08-30.
            location: codex/opdev-0.1
      - rule_id: MCD-FLOW-001
        outcome: not_applicable
        summary: No failing required trunk pipeline exists during initial CI bootstrap; GitLab now requires successful pipelines before merge.
        evidence:
          - kind: remote
            summary: The project has no red trunk pipeline, and only_allow_merge_if_pipeline_succeeds is enabled.
            location: https://gitlab.com/stolenfootball-tools/opinionateddevelopment/-/pipelines
      - rule_id: MCD-COMPAT-001
        outcome: passed
        summary: Existing CLI, schema, report, plugin, hook, and CI behavior remains covered while the evidence and release surfaces are additive.
        evidence:
          - kind: test
            summary: All workspace unit, integration, schema, timeout, discovery, provider, and release tests pass under Rust 1.97.0.
            location: crates
          - kind: validation
            summary: Codex and Claude plugin validators accept the shared plugin and marketplace.
            location: plugins/opdev
      - rule_id: OPDEV-TEST-002
        outcome: passed
        summary: Material acceptance conditions and selected risks are traced to automated suites, provider lint, plugin validation, and release evidence checks.
        evidence:
          - kind: work
            summary: Phase 10 acceptance is represented by multi-ecosystem fixtures, self-checks, native matrix configuration, signing, SBOM, provenance, and documentation.
            location: https://gitlab.com/stolenfootball-tools/opinionateddevelopment/-/issues/10
          - kind: test
            summary: Canonical format, Clippy, test, release-build, deterministic package smoke, GitLab lint, and both plugin validation commands all complete successfully.
            location: .opdev/project.yaml
          - kind: ci
            summary: Native x86-64 and ARM64 archives for Windows, Linux GNU, and macOS were reproducibly packaged and smoke-tested on their declared GitHub runners.
            location: https://github.com/stolenfootball/opinionateddevelopment/actions/runs/33329402980
      - rule_id: OPDEV-AI-001
        outcome: passed
        summary: Agent-authored implementation is evaluated by the same strict compiler, linter, tests, schemas, CI linter, and evidence rules as any contribution.
        evidence:
          - kind: policy
            summary: Persistent agent guidance explicitly rejects self-attestation and requires canonical evidence.
            location: AGENTS.md
          - kind: test
            summary: The complete agent-authored workspace passes the canonical project suites.
            location: .opdev/project.yaml
      - rule_id: OPDEV-LEARN-001
        outcome: passed
        summary: Dogfooding exposed stale human-evidence reuse, an invalid pinned SBOM-generator invocation, malformed consumer download links, and remote audit evidence downgrading; each finding was reproduced and corrected before final release.
        evidence:
          - kind: decision
            summary: The generalized failure, alternatives, selected design, limitation, and reversal trigger are documented.
            location: spec/evidence-ledger.md
          - kind: test
            summary: Tests verify ledger schemas, satisfying-only claims, exact fingerprint reuse, exclusion of only the ledger, and fail-closed unindexed content.
            location: crates/opdev-project/src/evidence.rs
          - kind: ci
            summary: The first protected release candidate stopped before publication when cargo-cyclonedx rejected incompatible flags; the exact 0.5.9 generator was then run locally to confirm its output contract.
            location: https://gitlab.com/stolenfootball-tools/opinionateddevelopment/-/pipelines/2803657849
          - kind: release
            summary: The second release candidate proved build, signing, and publication, then consumer verification exposed GitLab's automatic downloads prefix; the release template now supplies unprefixed direct asset paths.
            location: https://gitlab.com/stolenfootball-tools/opinionateddevelopment/-/releases/v0.1.0-rc.2
          - kind: ci
            summary: Trunk qualification exposed deprecated Node 20 action runtimes and a redundant tag workflow; pinned supported actions and one build-only handoff now preserve the single delivery path.
            location: .github/workflows
          - kind: test
            summary: A read-only remote capability that cannot prove branch lifecycle no longer erases stronger reviewed evidence; definitive remote failures still replace it.
            location: crates/opdev-cli/src/main.rs
