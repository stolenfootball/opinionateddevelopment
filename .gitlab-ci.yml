stages:
  - verify
  - package
  - sign
  - publish

variables:
  CARGO_TERM_COLOR: always
  RUST_IMAGE: rust:1.97.0-bookworm

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

quality:
  stage: verify
  image: rust:1.97.0-bookworm
  script:
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets --all-features -- -D warnings
    - cargo test --workspace --all-features
    - cargo build --locked -p opdev-cli
    - ./target/debug/opdev check --ci --format json > opdev-report.json
  artifacts:
    when: always
    paths:
      - opdev-report.json
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

release-bundle-linux-x86_64:
  stage: package
  image: rust:1.97.0-bookworm
  needs: [quality]
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends ca-certificates curl
    - rm -rf /var/lib/apt/lists/*
  script:
    - cargo install --locked cargo-cyclonedx --version 0.5.9
    - cargo cyclonedx --manifest-path crates/opdev-cli/Cargo.toml --format json --describe binaries --all-features --target x86_64-unknown-linux-gnu --override-filename opdev.cdx --spec-version 1.5
    - cargo build --release --locked -p opdev-cli --target x86_64-unknown-linux-gnu
    - mkdir -p release-staging/plugin release-bundle
    - cp target/x86_64-unknown-linux-gnu/release/opdev release-staging/opdev
    - cp -R plugins/opdev release-staging/plugin/opdev
    - tar -C release-staging -czf release-bundle/opdev-x86_64-unknown-linux-gnu.tar.gz opdev plugin
    - cp crates/opdev-cli/opdev.cdx.json release-bundle/opdev-x86_64-unknown-linux-gnu.cdx.json
    - cargo run --locked -p opdev-cli -- release evidence --artifact release-bundle/opdev-x86_64-unknown-linux-gnu.tar.gz --sbom release-bundle/opdev-x86_64-unknown-linux-gnu.cdx.json --source-uri "$CI_PROJECT_URL" --source-revision "$CI_COMMIT_SHA" --builder-id "$CI_SERVER_URL/$CI_PROJECT_PATH/-/jobs/$CI_JOB_ID" --output release-bundle
    - cd release-bundle && sha256sum -c SHA256SUMS
  artifacts:
    paths:
      - release-bundle/
    expire_in: never
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

sign-release-linux-x86_64:
  stage: sign
  image: alpine:3.23.5
  needs:
    - job: release-bundle-linux-x86_64
      artifacts: true
  variables:
    COSIGN_YES: "true"
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - apk add --no-cache cosign
  script:
    - cosign sign-blob release-bundle/opdev-x86_64-unknown-linux-gnu.tar.gz --bundle release-bundle/opdev-x86_64-unknown-linux-gnu.sigstore.json
    - cosign verify-blob release-bundle/opdev-x86_64-unknown-linux-gnu.tar.gz --bundle release-bundle/opdev-x86_64-unknown-linux-gnu.sigstore.json --certificate-identity "${CI_PROJECT_URL}//.gitlab-ci.yml@refs/tags/${CI_COMMIT_TAG}" --certificate-oidc-issuer "$CI_SERVER_URL"
  artifacts:
    paths:
      - release-bundle/
    expire_in: never
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

publish-gitlab:
  stage: publish
  image: rust:1.97.0-bookworm
  needs:
    - job: sign-release-linux-x86_64
      artifacts: true
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends ca-certificates curl
    - rm -rf /var/lib/apt/lists/*
  script:
    - 'for file in release-bundle/*; do name=$(basename "$file"); curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/opdev/$CI_COMMIT_TAG/$name"; done'
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

create-gitlab-release:
  stage: publish
  image: registry.gitlab.com/gitlab-org/cli:v1.58.0
  needs: [publish-gitlab]
  script:
    - echo "Creating immutable OpDev release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: OpDev $CI_COMMIT_TAG
    description: Release artifacts, CycloneDX SBOM, checksums, release manifest, and SLSA-compatible provenance generated by the tag pipeline.
    assets:
      links:
        - name: opdev-x86_64-unknown-linux-gnu.tar.gz
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/opdev/$CI_COMMIT_TAG/opdev-x86_64-unknown-linux-gnu.tar.gz
          direct_asset_path: /downloads/opdev-x86_64-unknown-linux-gnu.tar.gz
        - name: opdev-x86_64-unknown-linux-gnu.cdx.json
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/opdev/$CI_COMMIT_TAG/opdev-x86_64-unknown-linux-gnu.cdx.json
          direct_asset_path: /downloads/opdev-x86_64-unknown-linux-gnu.cdx.json
        - name: opdev-x86_64-unknown-linux-gnu.sigstore.json
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/opdev/$CI_COMMIT_TAG/opdev-x86_64-unknown-linux-gnu.sigstore.json
          direct_asset_path: /downloads/opdev-x86_64-unknown-linux-gnu.sigstore.json
        - name: SHA256SUMS
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/opdev/$CI_COMMIT_TAG/SHA256SUMS
          direct_asset_path: /downloads/SHA256SUMS
        - name: opdev-release-manifest.json
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/opdev/$CI_COMMIT_TAG/opdev-release-manifest.json
          direct_asset_path: /downloads/opdev-release-manifest.json
        - name: opdev-provenance.intoto.json
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/opdev/$CI_COMMIT_TAG/opdev-provenance.intoto.json
          direct_asset_path: /downloads/opdev-provenance.intoto.json
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
