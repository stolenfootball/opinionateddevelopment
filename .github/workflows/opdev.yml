name: OpDev

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
      - name: Evaluate source and OpDev integration gate
        run: |
          set -euo pipefail
          cargo +1.97.0 fmt --all -- --check
          cargo +1.97.0 clippy --workspace --all-targets --all-features -- -D warnings
          cargo +1.97.0 test --workspace --all-features
          cargo +1.97.0 build --locked -p opdev-cli
          report_file="$(mktemp)"
          set +e
          ./target/debug/opdev check --ci --format json > "$report_file"
          opdev_status=$?
          set -e
          mv "$report_file" opdev-report.json
          exit "$opdev_status"
      - name: Preserve OpDev evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opdev-report
          path: opdev-report.json
          if-no-files-found: warn
