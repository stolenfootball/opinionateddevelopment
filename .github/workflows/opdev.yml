name: OpDev

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
      - name: Evaluate source and OpDev integration gate
        run: |
          set -euo pipefail
          cargo +1.97.0 fmt --all -- --check
          cargo +1.97.0 clippy --workspace --all-targets --all-features -- -D warnings
          cargo +1.97.0 test --workspace --all-features
          cargo +1.97.0 build --locked -p opdev-cli
          report_file="$(mktemp)"
          set +e
          ./target/debug/opdev check --ci --format json > "$report_file"
          opdev_status=$?
          set -e
          mv "$report_file" opdev-report.json
          exit "$opdev_status"
      - name: Preserve OpDev evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opdev-report
          path: opdev-report.json
          if-no-files-found: warn
